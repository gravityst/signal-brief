name: Generate PNG icons

on:
  push:
    branches: [main]
    paths:
      - "apple-touch-icon.svg"
      - "icons/*.svg"
      - ".github/workflows/generate-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rsvg-convert
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Convert SVG to PNG
        run: |
          mkdir -p icons
          rsvg-convert -w 180 -h 180 apple-touch-icon.svg -o apple-touch-icon.png
          rsvg-convert -w 192 -h 192 icons/icon-192.svg -o icons/icon-192.png
          rsvg-convert -w 512 -h 512 icons/icon-512.svg -o icons/icon-512.png
          # solid square maskable variant
          rsvg-convert -w 512 -h 512 icons/icon-512.svg -o icons/icon-512-maskable.png
          ls -la apple-touch-icon.png icons/*.png

      - name: Commit PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icons/icon-192.png icons/icon-512.png icons/icon-512-maskable.png
          if git diff --staged --quiet; then
            echo "No icon changes"
          else
            git commit -m "Add PNG icons for iOS / Android home screen"
            git push
          fi
