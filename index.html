<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="X Signal — curated AI & tech posts from Elon Musk, Alex Finn, MKBHD and key voices." />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="X Signal" />
  <meta name="application-name" content="X Signal" />
  <meta property="og:title" content="X Signal" />
  <meta property="og:description" content="Curated AI & tech timeline from the sharpest voices on X." />
  <meta property="og:type" content="website" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>X Signal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="logo" aria-hidden="true">
            <!-- Original mark: sharp geometric X with signal pulse -->
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M7 7 L15.5 15.5 L7 25" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M25 7 L16.5 15.5 L25 25" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="16" cy="16" r="2.2" fill="currentColor"/>
            </svg>
          </span>
          <div class="brand-text">
            <span class="brand-name">X Signal</span>
            <span class="brand-sub">AI · Tech</span>
          </div>
        </div>
        <div class="topbar-meta">
          <span class="updated" id="last-updated">Loading…</span>
        </div>
      </div>
    </header>

    <!-- Tabs -->
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="for-you" role="tab" aria-selected="true">For You</button>
      <button class="tab" data-tab="following" role="tab" aria-selected="false">Following</button>
    </nav>

    <!-- Author filters -->
    <div class="author-bar" id="author-bar"></div>

    <!-- Timeline -->
    <main class="timeline" id="timeline" aria-label="Timeline">
      <div class="loading" id="loading">Loading posts…</div>
    </main>

    <!-- Empty state -->
    <div class="empty" id="empty" hidden>
      <p>No posts match the current filters.</p>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>X Signal · curated AI & tech posts · not affiliated with X Corp</p>
      <p class="footer-links">
        <a href="https://github.com/gravityst/signal-brief" target="_blank" rel="noopener">Source</a>
      </p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
